services:
  maps:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    # The caddy binary carries a file capability; exec fails unless it is in the bounding set.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    mem_limit: 128m
    environment:
      TZ: ${HOMEISLAND_TZ:?}
      XDG_DATA_HOME: /tmp/caddy-data
      XDG_CONFIG_HOME: /tmp/caddy-config
    command: ["caddy", "run", "--config", "/srv/app/Caddyfile", "--adapter", "caddyfile"]
    tmpfs:
      - /tmp:size=16m
    volumes:
      - type: bind
        source: ./modules/maps/www
        target: /srv/app
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${HOMEISLAND_DATA_DIR:?}/maps
        target: /srv/data
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 5s
      retries: 3
