# Extra local DNS records served by Pi-hole.
#
# Format: <IPv4 address> <name> [<name> ...]
# Names without a dot are placed under the HomeIsland domain (e.g. home.arpa).
# Apply changes with: sudo homeisland apply
#
# Examples (addresses are placeholders):
# 192.168.1.1   router
# 192.168.1.20  printer
# 192.168.1.30  nas backup-nas
